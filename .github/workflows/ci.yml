name: CI

on:
  push:
    branches: [ main, master, "claude/**" ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Syntax parse check
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Include *.ps1, *.psm1, *.psd1
          $bad = 0
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $bad++
              foreach ($e in $errors) { Write-Host "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)" }
            }
          }
          if ($bad) { throw "$bad file(s) have parse errors." }
          Write-Host "All $($files.Count) files parsed cleanly."

      - name: Import module
        shell: pwsh
        run: |
          Import-Module ./WindowsDiagnosticTool.psd1 -Force
          (Get-Command -Module WindowsDiagnosticTool).Name

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run Pester tests
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg

      - name: Windows end-to-end smoke (real event logs)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Import-Module ./WindowsDiagnosticTool.psd1 -Force
          # Real scan against the runner's event logs; report only, no fixes.
          $findings = Invoke-WindowsDiagnostic -Days 2 -Quiet -NoHtmlReport -PassThru
          Write-Host "Scan completed. Findings: $((@($findings)).Count)"
          Get-WindowsDiagnosticRule | Format-Table Id, Category, Severity, FixName -AutoSize | Out-String | Write-Host
